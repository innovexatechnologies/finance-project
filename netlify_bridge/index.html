<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open in SkillBridge</title>
  <meta name="description" content="Open this SkillBridge project, application, or certificate directly in the SkillBridge mobile app." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(145deg, #061936 0%, #0f2344 55%, #123e78 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(20, 184, 166, 0.18);
      border: 1px solid rgba(20, 184, 166, 0.45);
      color: #5eead4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .brand-accent { color: #14b8a6; }
    p {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #14b8a6 100%);
      color: #ffffff;
      margin-bottom: 10px;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .link-box {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(6, 25, 54, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #93c5fd;
      word-break: break-all;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #5eead4;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge" id="kindBadge">SkillBridge Link</span>
    <h1>Skill<span class="brand-accent">Bridge</span></h1>
    <p id="subtitle">Opening this item directly inside the SkillBridge app...</p>

    <a id="openBtn" class="btn btn-primary" href="skillbridge://open">Open in SkillBridge App</a>
    <button id="copyBtn" class="btn btn-secondary" type="button">Copy App Link</button>

    <div class="link-box" id="linkPreview">skillbridge://open</div>
    <div class="status" id="statusMsg"></div>
  </main>

  <script>
    (function () {
      var path = (window.location.pathname || "/").replace(/^\/+|\/+$/g, "");
      var search = window.location.search || "";
      var parts = path ? path.split("/").filter(Boolean) : [];

      var targetPath = "open";
      var label = "SkillBridge Link";
      if (parts.length >= 1) {
        var head = parts[0].toLowerCase();
        var rest = parts.slice(1).join("/");
        if (head === "project" || head === "projects") {
          targetPath = rest ? ("project/" + rest) : "open";
          label = "Shared Project";
        } else if (head === "application" || head === "applications") {
          targetPath = rest ? ("application/" + rest) : "open";
          label = "Shared Application";
        } else if (head === "certificate" || head === "certificates" || head === "verify") {
          targetPath = rest ? ("certificate/" + rest) : "open";
          label = "Verified Certificate";
        } else {
          targetPath = parts.join("/");
        }
      }

      var customUrl = "skillbridge://" + targetPath + search;
      var intentUrl =
        "intent://" +
        targetPath +
        search +
        "#Intent;scheme=skillbridge;package=com.example.link_vibe;end";

      var isAndroid = /android/i.test(navigator.userAgent || "");
      var launchUrl = isAndroid ? intentUrl : customUrl;

      document.getElementById("kindBadge").textContent = label;
      document.getElementById("linkPreview").textContent = customUrl;
      var openBtn = document.getElementById("openBtn");
      openBtn.setAttribute("href", launchUrl);

      document.getElementById("copyBtn").addEventListener("click", function () {
        var status = document.getElementById("statusMsg");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(customUrl).then(function () {
            status.textContent = "Copied! Open SkillBridge -> Open Shared Link to paste.";
          }).catch(function () {
            status.textContent = "Select and copy the link above.";
          });
        } else {
          status.textContent = "Select and copy the link above.";
        }
      });

      if (parts.length >= 2) {
        setTimeout(function () {
          window.location.href = launchUrl;
        }, 120);
      }
    })();
  </script>
</body>
</html>
